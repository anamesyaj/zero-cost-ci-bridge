name: Transient Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transient-private-validation
  cancel-in-progress: false

jobs:
  certify:
    name: Sanitized transient certification
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out bridge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check out transient workload
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
          ref: ${{ secrets.PRIVATE_SOURCE_REVISION }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: workload
          fetch-depth: 1
          persist-credentials: false

      - name: Configure transient Git access
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "${SOURCE_TOKEN}" | base64 -w0)"
          git -C "${GITHUB_WORKSPACE}/workload" config --local             http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth_header}"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Execute transient certification
        shell: bash
        env:
          CI: "true"
        run: |
          bash "${GITHUB_WORKSPACE}/scripts/certify.sh"             "${GITHUB_WORKSPACE}/workload"
