name: Transient Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transient-private-validation
  cancel-in-progress: false

jobs:
  certify:
    name: Sanitized transient certification
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out bridge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Acquire transient workload
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
          SOURCE_REVISION: ${{ secrets.PRIVATE_SOURCE_REVISION }}
          SOURCE_TOKEN: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          umask 077

          SOURCE_DIR="${GITHUB_WORKSPACE}/workload"
          ACQ_ROOT="${RUNNER_TEMP}/transient-acquisition-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ACQ_LOG="${ACQ_ROOT}/acquisition.log"
          ASKPASS="${ACQ_ROOT}/git-askpass.sh"

          cleanup_acquisition() {
            rm -rf "${ACQ_ROOT}" >/dev/null 2>&1 || true
          }
          trap cleanup_acquisition EXIT

          if [[ -z "${SOURCE_REPOSITORY:-}" || -z "${SOURCE_REVISION:-}" || -z "${SOURCE_TOKEN:-}" ]]; then
            printf '%s\n' 'CONFIGURATION: FAIL'
            exit 1
          fi

          if [[ ! "${SOURCE_REVISION}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            printf '%s\n' 'CONFIGURATION: FAIL'
            exit 1
          fi

          rm -rf "${SOURCE_DIR}"
          mkdir -p "${SOURCE_DIR}" "${ACQ_ROOT}"

          cat >"${ASKPASS}" <<'ASKPASS_EOF'
          #!/usr/bin/env bash
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *) printf '%s\n' "${SOURCE_TOKEN}" ;;
          esac
          ASKPASS_EOF
          chmod 700 "${ASKPASS}"
          export GIT_ASKPASS="${ASKPASS}"
          export GIT_TERMINAL_PROMPT=0

          if ! (
            cd "${SOURCE_DIR}"
            git init --quiet
            git remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
            git fetch --quiet --no-tags --depth=1 origin "${SOURCE_REVISION}"
            git checkout --quiet --detach FETCH_HEAD
            git reset --quiet --hard FETCH_HEAD
            auth_header="$(printf 'x-access-token:%s' "${SOURCE_TOKEN}" | base64 -w0)"
            git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth_header}"
          ) >"${ACQ_LOG}" 2>&1; then
            rm -rf "${SOURCE_DIR}"
            printf '%s\n' 'SOURCE_ACQUISITION: FAIL'
            exit 1
          fi

          printf '%s\n' 'SOURCE_ACQUISITION: PASS'
          trap - EXIT
          cleanup_acquisition

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Execute transient certification
        shell: bash
        env:
          CI: "true"
        run: |
          bash "${GITHUB_WORKSPACE}/scripts/certify.sh" "${GITHUB_WORKSPACE}/workload"
