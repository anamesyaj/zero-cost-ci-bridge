name: Transient Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transient-private-validation
  cancel-in-progress: false

jobs:
  certify:
    name: Sanitized transient certification
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Execute transient certification
        shell: bash
        env:
          CI: "true"
          SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
          SOURCE_REVISION: ${{ secrets.PRIVATE_SOURCE_REVISION }}
          SOURCE_TOKEN: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
        run: |
          set -u -o pipefail
          umask 077

          ROOT="${RUNNER_TEMP}/transient-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SOURCE_DIR="${ROOT}/workload"
          LOG_DIR="${ROOT}/private-logs"
          ARCHIVE="${ROOT}/source.tar.gz"
          DB_START_ATTEMPTED=0

          status() {
            printf '%s: %s\n' "$1" "$2"
          }

          cleanup() {
            set +e
            local rc=0

            if [[ "${DB_START_ATTEMPTED}" -eq 1 && -x "${SOURCE_DIR}/node_modules/.bin/supabase" ]]; then
              (
                cd "${SOURCE_DIR}" &&
                ./node_modules/.bin/supabase stop --all --no-backup >/dev/null 2>&1
              ) || rc=1
            fi

            rm -rf "${ROOT}" || rc=1

            if [[ ${rc} -eq 0 ]]; then
              status CLEANUP PASS
            else
              status CLEANUP FAIL
            fi

            return "${rc}"
          }

          finish() {
            local original_rc=$?
            trap - EXIT
            set +e
            cleanup
            local cleanup_rc=$?

            if [[ ${original_rc} -eq 0 && ${cleanup_rc} -eq 0 ]]; then
              status CERTIFICATION PASS
              exit 0
            fi

            status CERTIFICATION FAIL
            exit 1
          }

          trap finish EXIT

          if [[ -z "${SOURCE_REPOSITORY:-}" || -z "${SOURCE_REVISION:-}" || -z "${SOURCE_TOKEN:-}" ]]; then
            status CONFIGURATION FAIL
            exit 1
          fi

          if [[ ! "${SOURCE_REVISION}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            status CONFIGURATION FAIL
            exit 1
          fi

          mkdir -p "${SOURCE_DIR}" "${LOG_DIR}"

          if ! curl --fail --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${SOURCE_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "${ARCHIVE}" \
            "https://api.github.com/repos/${SOURCE_REPOSITORY}/tarball/${SOURCE_REVISION}" \
            2>"${LOG_DIR}/source-acquisition.log"; then
            status SOURCE_ACQUISITION FAIL
            exit 1
          fi

          if ! tar -xzf "${ARCHIVE}" --strip-components=1 -C "${SOURCE_DIR}" \
            >"${LOG_DIR}/extract.log" 2>&1; then
            status SOURCE_ACQUISITION FAIL
            exit 1
          fi

          rm -f "${ARCHIVE}"
          status SOURCE_ACQUISITION PASS

          run_phase() {
            local phase="$1"
            shift
            local log_name
            log_name="$(printf '%s' "${phase}" | tr '[:upper:]' '[:lower:]')"

            if (
              cd "${SOURCE_DIR}" &&
              "$@"
            ) >"${LOG_DIR}/${log_name}.log" 2>&1; then
              status "${phase}" PASS
              return 0
            fi

            status "${phase}" FAIL
            return 1
          }

          run_phase DEPENDENCIES npm ci || exit 1
          run_phase LINT npm run lint || exit 1
          run_phase TESTS npm test || exit 1
          run_phase BUILD npm run build || exit 1

          if (
            cd "${SOURCE_DIR}"
            expected_version="$(node -p "require('./package.json').devDependencies?.supabase || ''")"
            actual_version="$(./node_modules/.bin/supabase --version)"
            [[ "${expected_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            [[ "${actual_version}" == "${expected_version}" ]]
            ./node_modules/.bin/supabase db start --help >/dev/null
            ./node_modules/.bin/supabase test db --help >/dev/null
          ) >"${LOG_DIR}/database-toolchain.log" 2>&1; then
            status DATABASE_TOOLCHAIN PASS
          else
            status DATABASE_TOOLCHAIN FAIL
            exit 1
          fi

          for forbidden_name in \
            SUPABASE_ACCESS_TOKEN \
            SUPABASE_DB_PASSWORD \
            SUPABASE_PROJECT_ID \
            SUPABASE_SERVICE_ROLE_KEY \
            SUPABASE_SECRET_KEY; do
            if [[ -n "${!forbidden_name-}" ]]; then
              status CREDENTIAL_GUARD FAIL
              exit 1
            fi
          done
          status CREDENTIAL_GUARD PASS

          DB_START_ATTEMPTED=1
          run_phase DATABASE_START ./node_modules/.bin/supabase db start || exit 1
          run_phase DATABASE_CERTIFICATION ./node_modules/.bin/supabase test db || exit 1
